<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Campus Canteen Express</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.4rem;
            font-weight: 900;
            margin-bottom: 1.5rem;
            color: var(--slate-900);
        }

        .auth-brand span {
            color: var(--primary);
        }
    </style>
</head>
<body class="auth-page">
    <main class="container" style="display: flex; justify-content: center; align-items: center; min-height: 85vh; padding-top: 2rem; padding-bottom: 2rem;">
        <div class="card" style="max-width: 480px; width: 100%; padding: 2.25rem; box-shadow: var(--shadow-lg);">
            <div class="auth-brand">
                <div class="brand-icon-box">🍽️</div>
                <span>Campus</span> Canteen
            </div>

            <div style="text-align: center; margin-bottom: 1.75rem;">
                <h2 style="font-size: 1.6rem; font-weight: 900; margin-bottom: 0.35rem; color: var(--slate-900);">
                    Create Student Account
                </h2>
                <p style="color: var(--slate-500); font-size: 0.9rem;">
                    Sign up to skip the queue and pre-order campus food
                </p>
            </div>
            
            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" id="name" class="form-input" placeholder="e.g. Rahul Sharma" required minlength="2" autocomplete="name">
                    <div class="form-error" id="nameError"></div>
                </div>
                
                <div class="form-group">
                    <label for="email" class="form-label">Campus Email</label>
                    <input type="email" id="email" class="form-input" placeholder="e.g. rahul@campus.edu" required autocomplete="email">
                    <div class="form-error" id="emailError"></div>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
                    <div class="form-error" id="passwordError"></div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Re-enter your password" required minlength="6" autocomplete="new-password">
                    <div class="form-error" id="confirmPasswordError"></div>
                </div>
                
                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.85rem; color: var(--slate-700);">
                        <input type="checkbox" id="terms" required style="width: 16px; height: 16px; accent-color: var(--primary);">
                        <span>I accept the <a href="#" style="color: var(--primary); font-weight: 600;">Terms &amp; Conditions</a></span>
                    </label>
                    <div class="form-error" id="termsError"></div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" id="registerBtn" style="padding: 0.85rem; font-size: 1rem; font-weight: 700;">
                    Create Account
                </button>
                
                <p style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--slate-600);">
                    Already have an account? <a href="/login.html" style="font-weight: 700; color: var(--primary);">Sign in</a>
                </p>
            </form>
        </div>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
