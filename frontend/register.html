<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Campus Canteen Express</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
    <main class="container">
        <div class="auth-card">
            <h2>Create Account</h2>
            <p class="text-muted">Sign up to start ordering</p>
            
            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" id="name" class="form-input" required minlength="2">
                    <div class="form-error" id="nameError"></div>
                </div>
                
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-input" required>
                    <div class="form-error" id="emailError"></div>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" required minlength="6">
                    <div class="form-error" id="passwordError"></div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-input" required minlength="6">
                    <div class="form-error" id="confirmPasswordError"></div>
                </div>
                
                <div class="form-group">
                    <label class="flex items-center gap-2">
                        <input type="checkbox" id="terms" required>
                        <span class="text-sm">I accept the Terms and Conditions</span>
                    </label>
                    <div class="form-error" id="termsError"></div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100" id="registerBtn">Create Account</button>
                
                <p class="mt-4 text-center text-sm">
                    Already have an account? <a href="/login.html" class="text-primary font-medium">Login</a>
                </p>
            </form>
        </div>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
