<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Campus Canteen Express</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
    <main class="container">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="text-muted">Login to your account to order food</p>
            
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-input" required>
                    <div class="form-error" id="emailError"></div>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" required minlength="6">
                    <div class="form-error" id="passwordError"></div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" id="loginBtn" style="width: 100%; margin-top: 10px;">Login</button>
                
                <div style="margin-top: 20px; padding: 12px; background: var(--border-light); border-radius: var(--radius); font-size: 12px;">
                    <p style="font-weight: 600; margin-bottom: 6px; color: var(--text);">Quick Demo Accounts:</p>
                    <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                        <button type="button" class="btn btn-outline btn-sm" style="flex: 1; font-size: 11px; padding: 4px 8px;" onclick="document.getElementById('email').value='student@campus.edu';document.getElementById('password').value='Student@12345';">👤 Student</button>
                        <button type="button" class="btn btn-outline btn-sm" style="flex: 1; font-size: 11px; padding: 4px 8px;" onclick="document.getElementById('email').value='admin@canteen.local';document.getElementById('password').value='Admin@123';">🛡️ Admin</button>
                    </div>
                    <p style="color: var(--muted); margin: 0;">Student: <code>student@campus.edu</code> (<code>Student@12345</code>)<br>Admin: <code>admin@canteen.local</code> (<code>Admin@123</code>)</p>
                </div>

                <p class="mt-4 text-center text-sm" style="margin-top: 15px; text-align: center;">
                    Don't have an account? <a href="/register.html" class="text-primary font-medium">Sign up</a>
                </p>
            </form>
        </div>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
